<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Tracker - Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0d9488 0%, #059669 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .container {
            text-align: center;
            max-width: 600px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .emoji {
            font-size: 4rem;
            margin-bottom: 20px;
            display: block;
        }

        p {
            font-size: 1.25rem;
            margin-bottom: 15px;
            opacity: 0.95;
        }

        .success {
            background: rgba(16, 185, 129, 0.2);
            padding: 20px;
            border-radius: 10px;
            margin-top: 30px;
            border: 2px solid rgba(16, 185, 129, 0.5);
        }

        .button {
            display: inline-block;
            padding: 15px 40px;
            background: white;
            color: #0d9488;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            margin-top: 30px;
            transition: all 0.3s;
            cursor: pointer;
            border: none;
            font-size: 1.1rem;
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="emoji">🏋️</span>
        <h1>Fitness Tracker</h1>
        <p>Preview System Test</p>

        <div class="success">
            <p style="font-size: 1.5rem; margin: 0;">✓ Preview is Working!</p>
        </div>

        <p style="margin-top: 30px; font-size: 1rem; opacity: 0.8;">
            If you can see this page, your preview system is functioning correctly.
        </p>

        <button class="button" onclick="location.href='/'">
            Go to Main App
        </button>
    </div>

    <script>
        console.log('✓ Test page loaded successfully!');
        console.log('✓ Preview system is working');
        console.log('Current URL:', window.location.href);
    </script>
</body>
</html>
